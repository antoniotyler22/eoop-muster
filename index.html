        .then(()=>{SB.notify(rid);msg.innerHTML="<b style='color:var(--s-onhand)'>✓ Checked in: "+word+".</b> Your leader sees it now. You can close this page.";m.querySelectorAll("[data-c]").forEach(x=>x.disabled=false)})
        .catch(()=>{msg.textContent="Couldn't reach the server. Opening a text instead…";m.querySelectorAll("[data-c]").forEach(x=>x.disabled=false);setTimeout(sms,700)});return}
    sms()});}
/* broadcast page: shows the leader's message; one tap says "Got it". Message rides in the link, never on the server. */
function bcPage(q){const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const rid=(q.get("bc")||"").replace(/[^a-z0-9]/gi,"").slice(0,16),unit=(q.get("u")||"").replace(/[|#<>]/g,"").slice(0,24),to=(q.get("to")||"").replace(/\D/g,"").slice(-10),msgT=(q.get("m")||"").slice(0,320);
  const live=/^[a-z0-9]{8,16}$/.test(rid);const KM=K+"-ci-me";let me="";try{me=localStorage.getItem(KM)||""}catch(e){}
  document.title="Message";const m=document.createElement("main");m.className="wrap ci-page";
  m.innerHTML=`<h2 style="margin-top:18px">Message from ${esc(unit||"your leader")}</h2><div class="panel">
    <div style="font-size:18px;line-height:1.45;white-space:pre-wrap;font-weight:600">${esc(msgT)||"(no message text)"}</div>
    <label for="ciN">Your rank and last name</label><input type="text" id="ciN" value="${esc(me)}" maxlength="30" placeholder="CPL SMITH" autocapitalize="characters" style="text-transform:uppercase">
    <button class="btn" data-c="1" style="min-height:56px;font-size:18px">✓ Got it</button>
    <label for="ciE">Problem or question? Add a short note</label><input type="text" id="ciE" maxlength="40" placeholder="On duty till 0800">
    <button class="btn alt" data-c="2" style="min-height:52px">Got it, but I have a problem</button>
    <p class="note" id="ciMsg">Tap once. Your leader sees it right away.</p>
    <p class="note">Your name is scrambled before it leaves this phone; the server never stores it or the message. Your name is remembered on this phone only.</p></div>`;
  document.body.appendChild(m);document.querySelectorAll(".top,#helpBtn").forEach(x=>x.hidden=true);
  m.addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;const n=document.getElementById("ciN").value.toUpperCase().replace(/[|#]/g," ").replace(/\s+/g," ").trim();
    const out=document.getElementById("ciMsg");if(!n){out.textContent="Enter your rank and last name first.";document.getElementById("ciN").focus();return}
    try{localStorage.setItem(KM,n)}catch(err){}const c=+b.dataset.c;const note=document.getElementById("ciE").value.replace(/[|#]/g," ").replace(/\s+/g," ").trim();
    const word=c===1?"GOT IT":"GOT IT, PROBLEM";const body=word+" - "+n+(note?" ("+note+")":"");
    const sms=()=>{location.href="sms:"+(to?"+1"+to:"")+"?&body="+encodeURIComponent(body)};
    if(!live||navigator.onLine===false||!crypto.subtle){sms();return}
    m.querySelectorAll("[data-c]").forEach(x=>x.disabled=true);out.textContent="Sending…";
    Promise.all(SB.words(n).map(w=>SB.h(rid,w))).then(hs=>SB.rpc("checkin",{p_recall:rid,p_words:hs,p_code:c,p_note:note}))
      .then(()=>{out.innerHTML="<b style='color:var(--s-onhand)'>✓ Sent: "+word+".</b> You can close this page.";m.querySelectorAll("[data-c]").forEach(x=>x.disabled=false)})
      .catch(err=>{const closed=/closed/i.test(String(err&&err.message));out.textContent=closed?"This message has been closed out. Text your leader if needed.":"Couldn't reach the server. Opening a text instead…";m.querySelectorAll("[data-c]").forEach(x=>x.disabled=false);if(!closed)setTimeout(sms,700)})});}
/* QR formation check-in page: one tap "I'm here". The code in the link changes every 30 seconds; the leader's phone checks it. */
function qrPage(q){const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const rid=(q.get("qr")||"").replace(/[^a-z0-9]/gi,"").slice(0,16),st=(q.get("s")||"").replace(/\D/g,"").slice(0,12),mac=(q.get("m")||"").replace(/[^0-9a-f]/g,"").slice(0,16),unit=(q.get("u")||"").replace(/[|#<>]/g,"").slice(0,24);
  const KM=K+"-ci-me";let me="";try{me=localStorage.getItem(KM)||""}catch(e){}
  document.title="Check in";const m=document.createElement("main");m.className="wrap ci-page";
  m.innerHTML=`<h2 style="margin-top:18px">${esc(unit||"Formation")} check-in</h2><div class="panel">
    <label for="ciN">Your rank and last name</label><input type="text" id="ciN" value="${esc(me)}" maxlength="30" placeholder="CPL SMITH" autocapitalize="characters" style="text-transform:uppercase">
    <button class="btn" id="qrHere" style="min-height:64px;font-size:20px">✓ I'm here</button><p class="note" id="ciMsg">Tap once. You show as present on your leader's muster.</p>
    <p class="note">Your name is scrambled before it leaves this phone. This code only works for about a minute.</p></div>`;
  document.body.appendChild(m);document.querySelectorAll(".top,#helpBtn").forEach(x=>x.hidden=true);
  document.getElementById("qrHere").addEventListener("click",e=>{const out=document.getElementById("ciMsg");const n=document.getElementById("ciN").value.toUpperCase().replace(/[|#]/g," ").replace(/\s+/g," ").trim();
    if(!n){out.textContent="Enter your rank and last name first.";return}try{localStorage.setItem(KM,n)}catch(err){}
    if(!/^[a-z0-9]{8,16}$/.test(rid)||!crypto.subtle){out.textContent="This code didn't scan right. Scan again.";return}
    e.target.disabled=true;out.textContent="Checking in…";
    Promise.all(SB.words(n).map(w=>SB.h(rid,w))).then(hs=>SB.rpc("checkin",{p_recall:rid,p_words:hs,p_code:1,p_note:"Q:"+st+":"+mac}))
      .then(()=>{out.innerHTML="<b style='color:var(--s-onhand);font-size:18px'>✓ You're checked in.</b>";e.target.textContent="✓ Done"})
      .catch(err=>{e.target.disabled=false;out.textContent=/closed/i.test(String(err&&err.message))?"This muster is closed.":"No signal or server problem. Tell your leader you're here."})});}
window.addEventListener("DOMContentLoaded",()=>{
  {const q=new URLSearchParams((location.hash||"").slice(1));if(q.get("ci")){ciPage(q);return}if(q.get("bc")){bcPage(q);return}if(q.get("qr")){qrPage(q);return}}
  if(!V.cfg||!localStorage.getItem(KE)){if(V.cfg&&!localStorage.getItem(KE)){try{localStorage.removeItem(KC)}catch(e){}V.cfg=null}startApp();return}
  const L=document.getElementById("lock"),dots=document.getElementById("lockDots"),err=document.getElementById("lockErr"),pad=document.getElementById("lockPad");
  const c=V.cfg;document.getElementById("lockT").textContent=c.title||"Accounted For";let pin="",busy=false,until=0;
  const draw=()=>{dots.innerHTML=Array.from({length:c.len||6},(_,i)=>`<i class="${i<pin.length?"on":""}"></i>`).join("")};
  pad.innerHTML=["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>k?`<button type="button" data-k="${k}" aria-label="${k==="⌫"?"Delete":k}">${k}</button>`:"<span></span>").join("");
  draw();L.hidden=false;document.body.classList.add("locked");
  async function tryPin(){busy=true;document.getElementById("lockSub").textContent="Checking…";
    const ok=await V.check(pin);
    if(ok){const k=await derive(pin,unb64(c.salt),c.iter);window.__RAW=await dec(k,localStorage.getItem(KE));V.key=k;V._p=pin;V.set({fails:0});
      L.hidden=true;document.body.classList.remove("locked");startApp();return}
    const f=(c.fails||0)+1;V.set({fails:f});pin="";draw();busy=false;document.getElementById("lockSub").textContent="Enter your PIN";
    if(c.wipe&&f>=10){err.textContent="Too many wrong PINs. Erasing data.";setTimeout(()=>V.eraseAll(),1200);busy=true;return}
    if(f>=5){until=Date.now()+30000*Math.pow(2,Math.min(f-5,5));err.textContent="Wrong PIN ("+f+" tries). Wait "+Math.round((until-Date.now())/1000)+" seconds."+(c.wipe?" Data erases at 10.":"")}
    else err.textContent="Wrong PIN."+(c.wipe?" "+(10-f)+" tries left before data is erased.":"");
    if(navigator.vibrate)navigator.vibrate([40,60,40])}
  pad.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b||busy)return;if(Date.now()<until){err.textContent="Wait "+Math.ceil((until-Date.now())/1000)+" seconds.";return}
    const k=b.dataset.k;if(k==="⌫")pin=pin.slice(0,-1);else if(pin.length<8)pin+=k;draw();if(pin.length===(c.len||6))tryPin()});
  document.addEventListener("keydown",e=>{if(L.hidden||busy)return;if(/^\d$/.test(e.key)){const b=pad.querySelector(`[data-k="${e.key}"]`);b&&b.click()}else if(e.key==="Backspace"){pad.querySelector('[data-k="⌫"]').click()}});
  let fArm=false;document.getElementById("lockForgot").addEventListener("click",e=>{
    if(!fArm){fArm=true;e.target.textContent="Tap again to ERASE all app data and start over";err.textContent="There is no PIN recovery. Your data is encrypted with your PIN.";return}
    V.eraseAll()});
  const f0=c.fails||0;if(f0>=5)until=Date.now()+30000;
  /* Face ID (iPhone app only): reads the PIN from the Keychain after a face match */
  const NB=window.MBN&&MBN.on&&c.face?MBN.Bio:null;
  if(NB){const fb=document.createElement("button");fb.type="button";fb.className="btn alt";fb.id="lockFace";fb.textContent="Use Face ID";fb.style.marginTop="10px";pad.after(fb);
    const go=()=>{if(busy||Date.now()<until)return;NB.load({reason:"Unlock "+(c.title||"Accounted For")}).then(r=>{if(r&&r.pin&&!busy){pin=String(r.pin);draw();tryPin()}}).catch(x=>{if(/changed|not set/i.test(String(x&&x.message)))err.textContent="Face ID changed. Enter your PIN, then turn Face ID on again in Security."})};
    fb.addEventListener("click",go);setTimeout(go,350)}
});
})();
