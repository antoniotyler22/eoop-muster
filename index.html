<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EOP Numbers">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1016" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%233b4a2c'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' text-anchor='middle' fill='%23d4ae4f'%3EEO%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%233b4a2c'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' text-anchor='middle' fill='%23d4ae4f'%3EEO%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>EOP Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first muster board — sticky tab strip (Board + five sections), big strength tiles, status grid, per-Marine status pickers */
:root{
  --bg:#f3f4ee; --surface:#ffffff; --surface-2:#e8eadf; --ink:#1d2219; --muted:#5f6656; --line:#cfd3c3;
  --olive:#3b4a2c; --olive-ink:#ffffff; --brass:#a8842a; --brass-soft:#efe3c2;
  --s-onhand:#2f7a3a; --s-aob:#2f6fa8; --s-aoff:#5a5fae; --s-duty:#a8842a; --s-op:#b8552c; --s-tad:#7b4f9a; --s-leave:#6c6f66;
  --warn:#b3261e;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13160f; --surface:#1c2017; --surface-2:#262b1f; --ink:#e9ecdf; --muted:#a4ab95; --line:#363c2c;
  --olive:#4c5f38; --olive-ink:#ffffff; --brass:#d4ae4f; --brass-soft:#3a3220;
  --s-onhand:#5fbf6b; --s-aob:#62a6e0; --s-aoff:#8f94e6; --s-duty:#d4ae4f; --s-op:#e48558; --s-tad:#b98ad8; --s-leave:#a3a69c;
  --warn:#ff8a80; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#13160f; --surface:#1c2017; --surface-2:#262b1f; --ink:#e9ecdf; --muted:#a4ab95; --line:#363c2c;
  --olive:#4c5f38; --olive-ink:#ffffff; --brass:#d4ae4f; --brass-soft:#3a3220;
  --s-onhand:#5fbf6b; --s-aob:#62a6e0; --s-aoff:#8f94e6; --s-duty:#d4ae4f; --s-op:#e48558; --s-tad:#b98ad8; --s-leave:#a3a69c;
  --warn:#ff8a80; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--olive)}
.wrap{max-width:560px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* header + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--olive);color:var(--olive-ink);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand h1{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.02em;margin:0;line-height:1;white-space:nowrap}
.brand>div:first-child{min-width:0;overflow:hidden}
.brand .dtg{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.04em;opacity:.85;white-space:nowrap}
.acts{display:flex;gap:4px;flex-shrink:0}
.acts button{background:transparent;border:1px solid rgba(255,255,255,.45);color:var(--olive-ink);border-radius:6px;
  padding:5px 6px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.acts button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#1d2219}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-top:10px}
.tabs button{background:transparent;border:0;color:var(--olive-ink);padding:8px 0 9px;border-bottom:3px solid transparent;
  font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;line-height:1.05;opacity:.8}
.tabs button small{display:block;font-family:var(--body);font-weight:500;font-size:10.5px;letter-spacing:0;opacity:.85}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--brass)}

.banner{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--brass-soft);font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{border:0;background:var(--olive);color:var(--olive-ink);border-radius:6px;padding:6px 10px;font-weight:600;font-size:13px;white-space:nowrap}
.note{color:var(--muted);font-size:12.5px}

/* strength tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .lbl{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tile .num{font-family:var(--display);font-weight:800;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.tile.on .num{color:var(--s-onhand)}
.pct{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.bar{flex:1;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--s-onhand)}
.pct b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.att{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px dashed var(--brass);border-radius:10px;padding:10px 14px}
.att .lbl{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.att .big{font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.att .big small{font-size:13px;font-family:var(--body);font-weight:600;color:var(--muted);margin-left:6px}
.att button{border:0;background:var(--brass);color:#1d2219;border-radius:6px;padding:7px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.pct span{font-size:12px;color:var(--muted);white-space:nowrap}

/* grid */
h2{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin:22px 0 8px}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
th:first-child,td:first-child{text-align:left;padding-left:10px;white-space:nowrap}
thead th{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.05em;background:var(--surface-2)}
thead th button{border:0;background:transparent;font:inherit;color:var(--olive);text-decoration:underline;text-underline-offset:3px;padding:2px 4px}
:root[data-theme="dark"] thead th button{color:var(--brass)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) thead th button{color:var(--brass)}}
td.z{color:var(--muted);opacity:.55}
td.tot,th.tot{font-weight:700;background:var(--surface-2)}
tr.sum td{font-weight:700;background:var(--surface-2)}
tr.key td{font-family:var(--display);font-size:17px;font-weight:800;background:var(--olive);color:var(--olive-ink);border-bottom:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}

/* section list */
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:16px}
.sechead h2{margin:0}
.sechead .ratio{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.sechead .ratio small{font-size:12px;font-family:var(--body);font-weight:600;color:var(--muted);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:8px}
.list{display:flex;flex-direction:column;gap:6px}
.m{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-left:5px solid var(--sc,var(--line));border-radius:8px;padding:9px 10px}
.m .who{min-width:0}
.m .who b{font-family:var(--display);font-weight:700;letter-spacing:.04em;margin-right:6px}
.m .who .nm{font-weight:600}
.m .who .det{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .pick{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.m select.duty{padding:5px 6px;font-size:12.5px;font-weight:600;background:var(--surface)}
.m select.duty.ld{border-color:var(--s-duty);color:var(--s-duty)}
.m select.duty.lim{border-color:var(--warn);color:var(--warn)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px;border:1px solid}
.tag.ld{color:var(--s-duty);border-color:var(--s-duty)}.tag.lim{color:var(--warn);border-color:var(--warn)}
.dutyline{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.pt-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pt-sum div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.pt-sum b{display:block;font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.pt-sum span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pt-sum .go b{color:var(--s-onhand)}
.evts{display:flex;flex-wrap:wrap;gap:6px}
.evts button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.evts button[aria-pressed="true"]{background:var(--olive);color:var(--olive-ink);border-color:var(--olive)}
.grp{margin-top:12px}
.grp h3{font-family:var(--display);font-size:16px;letter-spacing:.05em;margin:0 0 6px;display:flex;justify-content:space-between}
.names{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.7}
.names div{border-bottom:1px solid var(--line)}.names div:last-child{border-bottom:0}
.wta{min-height:74px;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font:inherit;resize:vertical}
.wsel{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font:inherit}
.m .w6{border:0;background:transparent;color:var(--brass);font-size:12px;font-weight:700;padding:2px 0 2px 12px}
.bigbtns{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bigbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left}
.bigbtn b{font-family:var(--display);font-size:18px;letter-spacing:.04em}
.bigbtn span{font-size:11.5px;color:var(--muted);line-height:1.3}
.bigbtn.hot{border-color:var(--warn)}.bigbtn.hot span.w{color:var(--warn);font-weight:700}
.bigbtn.live{border-color:var(--s-onhand)}.bigbtn.live span{color:var(--s-onhand);font-weight:700}
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,110px));z-index:4;background:var(--bg);padding:8px 0;display:flex;gap:8px;align-items:center;justify-content:space-between}
.mbar .ct{font-family:var(--display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.mbar .ct small{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);margin-left:4px}
.mbar .un{color:var(--warn)}
.mrow{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;text-align:left;font-size:15px}
.mrow .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-weight:800;color:#fff}
.mrow.on{border-color:var(--s-onhand)}.mrow.on .box{background:var(--s-onhand);border-color:var(--s-onhand)}
.mrow .nm2{flex:1;min-width:0}
.mgrp{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.mgrp h3{margin:0;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:16px;letter-spacing:.05em}
.mgrp h3 button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700}
.alist{display:flex;flex-direction:column;gap:6px}
.arow{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sc,var(--line));border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.arow .when{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ahead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.ahead h2{margin:0}.ahead span{font-weight:700;font-size:13px;color:var(--muted)}
.sync{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sync h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hist{font-size:13px}.hist div{padding:6px 0;border-bottom:1px solid var(--line)}.hist div:last-child{border-bottom:0}
.rrow{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sc,var(--line));border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.rtop{display:flex;align-items:center;gap:8px}
.rtop .who{flex:1;min-width:0}
.rtop .ph{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
a.call,a.txt{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:40px;border-radius:8px;font-weight:700;text-decoration:none;font-size:14px}
a.call{background:var(--s-onhand);color:#fff}
a.txt{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);min-width:46px}
.rres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rres button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 4px;font-size:12.5px;font-weight:700}
.rres button[aria-pressed="true"]{color:#fff;border-color:transparent}
.rres button[data-r="ok"][aria-pressed="true"]{background:var(--s-onhand)}
.rres button[data-r="vm"][aria-pressed="true"]{background:var(--s-duty)}
.rres button[data-r="na"][aria-pressed="true"]{background:var(--warn)}
.rvlist{display:flex;flex-direction:column;gap:8px}.rvsel{width:100%;padding:9px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);color:var(--ink);font-size:16px}
.btn[disabled]{opacity:.45}
.addph{display:flex;gap:6px}.addph input{flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2)}
.addph button{border:0;background:var(--olive);color:var(--olive-ink);border-radius:7px;padding:0 12px;font-weight:700}
.m .tel{color:var(--s-onhand);font-size:12px;font-weight:700;text-decoration:none;padding:2px 0 2px 12px}
.evrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;text-align:left}
.evrow .p{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.evrow .p small{font-size:11px;font-family:var(--body);color:var(--muted);font-weight:600;margin-left:3px}
.wrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sc,var(--line));border-radius:8px;padding:8px 10px}
.wrow .rk{font-family:var(--display);font-weight:800;font-size:20px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.wrow .wi{flex:1;min-width:0}
.wrow .wi .s{font-size:12.5px;color:var(--muted)}
.wst{display:grid;grid-template-columns:1fr;gap:5px;width:98px;flex-shrink:0}
.wst button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:8px 4px;font-size:12.5px;font-weight:700}
.wst button[aria-pressed="true"]{color:#fff;border-color:transparent}
.wst button[data-ws="in"][aria-pressed="true"]{background:var(--s-onhand)}
.wst button[data-ws="out"][aria-pressed="true"]{background:var(--s-aob)}
.wedit{display:grid;grid-template-columns:1fr 70px 80px;gap:6px;margin-top:6px}
.wedit select,.wedit input{padding:8px 6px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);min-width:0}
.wedit .full{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.m select{max-width:44vw;padding:8px 6px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px}
.m .rm{border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 0;text-align:left}
.m .rm.arm{color:var(--warn);font-weight:700}
.addbox{margin-top:14px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:90px 1fr;gap:8px}
.addbox h3{grid-column:1/-1;margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.addbox input,.addbox select{padding:9px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);min-width:0}
.addbox .full{grid-column:1/-1}
.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:700;background:var(--olive);color:var(--olive-ink)}
.btn.alt{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:transparent;color:var(--warn);border:1px solid var(--warn)}

/* text + data panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.panel label{font-size:13px;font-weight:600}
.panel input[type=text],.panel input[type=tel]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
textarea{width:100%;min-height:230px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.45;
  padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{display:flex;align-items:center;gap:8px;font-size:14px}
.tog input{width:20px;height:20px;accent-color:var(--olive)}
a.btn{text-decoration:none;text-align:center;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);

<main class="wrap" id="main"></main>

<div class="sheet" id="sheet" hidden><div class="sheet-bg" data-sclose="1"></div><div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetT"><div class="grab"></div><h3 id="sheetT"></h3><div class="sheet-opts" id="sheetOpts"></div></div></div>


<script>
const STATUSES=["On Hand","Appointment on Base","Appointment off Base","Company Duties","Operation","TAD","Leave"];
const SHORT={"On Hand":"On Hand","Appointment on Base":"Appt On Base","Appointment off Base":"Appt Off Base","Company Duties":"Co Duties","Operation":"Operation","TAD":"TAD","Leave":"Leave"};
const SVAR={"On Hand":"--s-onhand","Appointment on Base":"--s-aob","Appointment off Base":"--s-aoff","Company Duties":"--s-duty","Operation":"--s-op","TAD":"--s-tad","Leave":"--s-leave"};
const PRESENT=["On Hand","Appointment on Base","Company Duties"];
const SECTIONS=[["HQ","Headquarters"],["HE","Heavy Equipment"],["CE","Combat Engineer"],["ORD","Ordnance"],["UT","Utilities"]];
const ATT=["ATT","Attached"];
const DUTIES=["Full Duty","Light Duty","LIMDU"];
const EVENTS=["Unit PT","Hike","Run","PFT","CFT","Field event"];
const RANKS=["CWO5","CWO4","CWO3","CWO2","WO","MAJ","CAPT","1STLT","2NDLT","SGTMAJ","MGYSGT","1STSGT","MSGT","GYSGT","SSGT","SGT","CPL","LCPL","PFC","PVT"];
const KEY="eoop-muster-v1";

function sampleRoster(){
  const spec=[["HQ",["MSGT","SGT","CPL","LCPL"],["On Hand","On Hand","TAD","Leave"]],
    ["HE",["GYSGT","SGT","CPL","CPL","LCPL","LCPL","PFC"],["On Hand","On Hand","TAD","On Hand","Leave","On Hand","Company Duties"]],
    ["CE",["SGT","CPL","LCPL","LCPL"],["On Hand","TAD","On Hand","Appointment off Base"]],
    ["ORD",["SSGT","CPL","LCPL","PFC"],["Leave","On Hand","On Hand","On Hand"]],
    ["UT",["GYSGT","SGT","CPL","LCPL","LCPL","PFC"],["On Hand","Operation","Operation","Appointment on Base","On Hand","TAD"]]];
  const out=[];let n=1;
  for(const [sec,ranks,sts] of spec) ranks.forEach((r,i)=>out.push({id:"s"+n,rank:r,name:"SAMPLE, MARINE "+String(n++).padStart(2,"0"),sec,status:sts[i],detail:"Sample row",loc:"",start:"",end:""}));
  out.push({id:"s"+n++,rank:"CPL",name:"SAMPLE, ATTACHED 01",sec:"ATT",parent:"CLB-3 (FAP in)",status:"On Hand",detail:"Working with HE",loc:"",start:"",end:"30 NOV 26"});
  out.push({id:"s"+n++,rank:"LCPL",name:"SAMPLE, ATTACHED 02",sec:"ATT",parent:"7th ESB (TAD to us)",status:"Appointment on Base",detail:"Working with UT",loc:"",start:"",end:"15 NOV 26"});
  if(out[5])out[5].duty="Light Duty";if(out[13])out[13].duty="LIMDU";
  return out;
}

let S={roster:sampleRoster(),source:"sample",loadedAt:"",recipients:"",names:false,pt:{event:"Unit PT",when:"",inc:["On Hand"],att:true}};
let storageOK=true;
try{const raw=localStorage.getItem(KEY); if(raw){const v=JSON.parse(raw); if(v&&Array.isArray(v.roster)) S=Object.assign(S,v);} }catch(e){storageOK=false}
S.w6=Array.isArray(S.w6)?S.w6:[];
S.hist=Array.isArray(S.hist)?S.hist:[];
S.events=Array.isArray(S.events)?S.events:[];
S.arm=Object.assign({open:false,start:0,st:{},only:false,last:""},S.arm||{});
S.rc=Object.assign({open:false,start:0,end:0,res:{},att:true,only:false},S.rc||{});
S.mus=Object.assign({open:false,seen:{},inc:["On Hand"],att:true,only:false,last:null},S.mus||{});
S.pt=Object.assign({event:"Unit PT",when:"",inc:["On Hand"],att:true},S.pt||{});
const dutyOf=m=>DUTIES.includes(m.duty)?m.duty:"Full Duty";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}

let view="board", armed=null, query="";
const h0=(location.hash||"").slice(1).toLowerCase();
if(["board","hq","he","ce","ord","ut","att","pt","w6","text","data","muster","alerts","recall","events","armory"].includes(h0)) view=h0;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

function counts(){
  const c={};for(const [k] of SECTIONS){c[k]={total:0};STATUSES.forEach(s=>c[k][s]=0)}
  for(const m of S.roster){if(!c[m.sec])continue;c[m.sec].total++;if(c[m.sec][m.status]!==undefined)c[m.sec][m.status]++}
  const T={total:0};STATUSES.forEach(s=>T[s]=0);
  for(const [k] of SECTIONS){T.total+=c[k].total;STATUSES.forEach(s=>T[s]+=c[k][s])}
  const A={total:0};STATUSES.forEach(x=>A[x]=0);
  for(const m of S.roster){if(m.sec!=="ATT")continue;A.total++;if(A[m.status]!==undefined)A[m.status]++}
  c.ATT=A;
  return {c,T,A};
}
const present=o=>PRESENT.reduce((a,s)=>a+o[s],0);
const pct=(a,b)=>b?Math.round(100*a/b):0;

function zoneLetter(){const off=-new Date().getTimezoneOffset()/60;if(!Number.isInteger(off))return"";if(off===0)return"Z";
  if(off>0&&off<=12)return"ABCDEFGHIKLM"[off-1];if(off<0&&off>=-12)return"NOPQRSTUVWXY"[-off-1];return""}
function dtg(d=new Date()){const M=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const p=n=>String(n).padStart(2,"0");return p(d.getDate())+p(d.getHours())+p(d.getMinutes())+zoneLetter()+" "+M[d.getMonth()]+" "+String(d.getFullYear()).slice(2)}

function rankIdx(r){const i=RANKS.indexOf(r);return i<0?99:i}
function sorted(list){return list.slice().sort((a,b)=>rankIdx(a.rank)-rankIdx(b.rank)||a.name.localeCompare(b.name))}

/* ---------- render ---------- */
function renderTabs(){
  const {c,T}=counts();
  const items=[["board","BOARD",T["On Hand"]+"/"+T.total]].concat(SECTIONS.map(([k])=>[k.toLowerCase(),k,c[k]["On Hand"]+"/"+c[k].total])).concat([["att","ATT","+"+c.ATT.total]]);
  $("#tabs").innerHTML=items.map(([id,lbl,sub])=>`<button role="tab" data-v="${id}" aria-selected="${view===id}">${lbl}<small>${sub}</small></button>`).join("");
  $("#b6W").setAttribute("aria-pressed",view==="w6");$("#bPT").setAttribute("aria-pressed",view==="pt");$("#bText").setAttribute("aria-pressed",view==="text");$("#bData").setAttribute("aria-pressed",view==="data");
  $("#dtg").textContent="AS OF "+dtg();
  {const tp=document.querySelector(".top");if(tp)document.documentElement.style.setProperty("--hdr",tp.offsetHeight+"px")}
}
function banner(){
  if(S.source==="sample") return `<div class="banner"><span>Showing <b>sample Marines</b>. Load your MOL detail list to start.</span><button data-go="data">Load roster</button></div>`;
  if(!storageOK) return `<div class="banner"><span>This browser isn't saving changes. Export a backup from DATA before closing.</span></div>`;
  return "";
}
function dutyCounts(list){const d={"Full Duty":0,"Light Duty":0,"LIMDU":0};list.forEach(m=>d[dutyOf(m)]++);return d}
function dutyChips(list){const d=dutyCounts(list);return `<span class="chip">Full Duty ${d["Full Duty"]}</span><span class="chip" style="color:var(--s-duty)">Light Duty ${d["Light Duty"]}</span><span class="chip" style="color:var(--warn)">LIMDU ${d["LIMDU"]}</span>`}
function renderBoard(){
  const {c,T,A}=counts();const P=pct(T["On Hand"],T.total);
  let h=banner();
  h+=`<div class="tiles">
    <div class="tile on"><div class="lbl">On Hand</div><div class="num" data-n="oh">${T["On Hand"]}</div></div>
    <div class="tile"><div class="lbl">Total Strength</div><div class="num" data-n="ts">${T.total}</div></div>
    <div class="pct"><b>${P}%</b><div class="bar"><i style="width:${P}%"></i></div><span>Present ${present(T)} · Off deck ${T.total-present(T)}</span></div>
    ${(()=>{const al=alerts();const M=S.mus;const pool=M.open?musPool():[];const sn=M.open?pool.filter(m=>M.seen[m.id]).length:0;
      return `<div class="bigbtns"><button class="bigbtn${M.open?" live":""}" data-go="muster"><b>MUSTER</b><span>${M.open?"In progress · "+sn+"/"+pool.length:M.last?"Last "+dtg(new Date(M.last.t)).slice(0,7)+" · "+M.last.present+"/"+M.last.expected:"Start formation muster"}</span></button>
      <button class="bigbtn${al.over.length?" hot":""}" data-go="alerts"><b>ALERTS</b><span>${al.over.length?`<span class="w">${al.over.length} overdue</span> · `:""}${al.ret.length} returning · ${al.dep.length} departing</span></button>
      <button class="bigbtn${S.rc.open?" live":""}" data-go="recall"><b>RECALL</b><span>${S.rc.open?"In progress · "+recallPool().filter(m=>(S.rc.res||{})[m.id]==="ok").length+"/"+recallPool().length:S.roster.filter(m=>m.phone).length+" numbers loaded"}</span></button>
      <button class="bigbtn" data-go="events"><b>EVENTS</b><span>${S.events.length?S.events.length+(S.events.length===1?" event · ":" events · ")+S.events.reduce((a,e)=>a+evReq(e).filter(m=>!evDone(e,m)).length,0)+" owe":"Attendance"}</span></button>
      <button class="bigbtn${S.arm.open?" live":""}" data-go="armory"><b>ARMORY</b><span>${S.arm.open?"Muster in progress":S.roster.filter(hasW).length+" weapons"}</span></button></div>`})()}
    <div class="dutyline">${dutyChips(S.roster.filter(m=>m.sec!=="ATT"))}<button class="chip" data-go="pt" style="cursor:pointer">PT roster ▸</button></div>
    <div class="att"><div><div class="lbl">Attached · not on our numbers</div><div class="big">${A.total}<small>${A["On Hand"]} on hand</small></div><div class="note">Total accounted for: <b>${T.total+A.total}</b> · Physically here: <b>${present(T)+present(A)}</b></div></div><button data-go="att">${A.total?"View":"Add"}</button></div>
  </div>`;
  h+=`<h2>By status</h2><div class="gridwrap"><table><thead><tr><th>Status</th>${SECTIONS.map(([k])=>`<th><button data-go="${k.toLowerCase()}">${k}</button></th>`).join("")}<th class="tot">Total</th></tr></thead><tbody>`;
  for(const s of STATUSES){h+=`<tr><td><span class="dot" style="background:var(${SVAR[s]})"></span>${SHORT[s]}</td>${SECTIONS.map(([k])=>`<td class="${c[k][s]?"":"z"}">${c[k][s]}</td>`).join("")}<td class="tot">${T[s]}</td></tr>`}
  h+=`<tr class="sum"><td>Present on deck</td>${SECTIONS.map(([k])=>`<td>${present(c[k])}</td>`).join("")}<td>${present(T)}</td></tr>`;
  h+=`<tr class="sum"><td>% On hand</td>${SECTIONS.map(([k])=>`<td>${pct(c[k]["On Hand"],c[k].total)}%</td>`).join("")}<td>${P}%</td></tr>`;
  h+=`<tr class="key"><td>On hand / strength</td>${SECTIONS.map(([k])=>`<td>${c[k]["On Hand"]}/${c[k].total}</td>`).join("")}<td>${T["On Hand"]}/${T.total}</td></tr>`;
  h+=`</tbody></table></div><p class="note">Present on deck = On Hand + Appt On Base + Co Duties. Tap a section to update its Marines.${S.loadedAt?" Roster loaded "+esc(S.loadedAt)+".":""}</p>`;
  $("#main").innerHTML=h;
}
function renderSection(code){
  const isAtt=code==="ATT";const name=isAtt?ATT[1]:SECTIONS.find(s=>s[0]===code)[1];const {c}=counts();const o=c[code];
  const list=sorted(S.roster.filter(m=>m.sec===code)).filter(m=>!query||(m.rank+" "+m.name).toLowerCase().includes(query));
  let h=banner();
  h+=`<div class="sechead"><h2>${code} · ${esc(name)}</h2><div class="ratio">${o["On Hand"]}/${o.total}<small>${isAtt?"on hand / attached":"on hand / strength"}</small></div></div>`;
  if(isAtt) h+=`<p class="note">Marines physically with us but carried on another unit's numbers (FAP in, TAD to us, attachments). They are tracked here and in the text report, but not added to Total Strength.</p>`;
  h+=`<div class="chips">${STATUSES.filter(s=>o[s]).map(s=>`<span class="chip"><span class="dot" style="background:var(${SVAR[s]})"></span>${SHORT[s]} ${o[s]}</span>`).join("")||'<span class="note">No Marines in this section yet.</span>'}</div>`;

/* ---------- dates ---------- */
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function parseD(s){if(!s)return null;s=String(s).trim().toUpperCase();let m=s.match(/^(\d{1,2}) ([A-Z]{3}) (\d{2,4})$/);
  if(m){const y=+m[3]<100?2000+ +m[3]:+m[3];const mo=MON.indexOf(m[2]);if(mo<0)return null;return new Date(y,mo,+m[1])}
  m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);return null}
function today0(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
const dayDiff=d=>Math.round((d-today0())/86400000);
const short=d=>String(d.getDate()).padStart(2,"0")+" "+MON[d.getMonth()];

/* ---------- alerts: overdue, returning, departing ---------- */
const AWAY=["Leave","TAD","Operation","Appointment off Base"];
function alerts(){const over=[],ret=[],dep=[];
  for(const m of S.roster){const e=parseD(m.end);
    if(e){const dd=dayDiff(e);
      if(m.sec==="ATT"){if(dd<0)over.push({m,dd,why:"Attachment ended "+short(e)})}
      else if(AWAY.includes(m.status)){if(dd<0)over.push({m,dd,why:m.status+" ended "+short(e)});else if(dd<=7)ret.push({m,dd,why:m.status+" ends "+short(e)})}}
    const x=parseD(m.edd);if(x&&m.sec!=="ATT"){const dd=dayDiff(x);if(dd<=90)dep.push({m,dd,why:"EDD "+short(x)+" "+String(x.getFullYear()).slice(2)})}}
  over.sort((a,b)=>a.dd-b.dd);ret.sort((a,b)=>a.dd-b.dd);dep.sort((a,b)=>a.dd-b.dd);return {over,ret,dep}}
function arow(a,label,col){const m=a.m;return `<div class="arow" style="--sc:var(${col})"><div style="min-width:0"><b>${esc(m.rank)}</b> ${esc(m.name)}<div class="note">${m.sec==="ATT"?"ATT":m.sec} · ${esc(a.why)}</div></div><div class="when">${label}</div></div>`}
function alertsText(){const {over,ret,dep}=alerts();const L=["EOOP ALERTS "+dtg()];
  const line=(a,t)=>"- "+(a.m.sec==="ATT"?"ATT":a.m.sec)+" "+a.m.rank+" "+a.m.name.split(",")[0]+": "+a.why+(t?" ("+t+")":"");
  L.push("");L.push("OVERDUE ("+over.length+")");over.forEach(a=>L.push(line(a,(-a.dd)+"D")));
  L.push("");L.push("RETURNING 7 DAYS ("+ret.length+")");ret.forEach(a=>L.push(line(a,a.dd?"IN "+a.dd+"D":"TODAY")));
  L.push("");L.push("DEPARTING 90 DAYS ("+dep.length+")");dep.forEach(a=>L.push(line(a,a.dd<0?"PAST":a.dd+"D")));
  return L.join("\n")}

function parseRecall(rows,free){rows=rows.map(r=>(r||[]).map(x=>String(x??"").trim())).filter(r=>r.some(Boolean));const recs=[];

/* ---------- CSV import ---------- */
function parseCSV(text){const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===","){row.push(f);f=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.map(r=>r.map(x=>x.replace(/\t/g,"").trim()));
}
function mapStatus(d){d=d||"";if(STATUSES.includes(d))return d;const l=d.toLowerCase();
  if(l.startsWith("leave"))return"Leave";if(l.startsWith("tad")||l.startsWith("fap"))return"TAD";
  if(l.startsWith("field"))return"Operation";if(l.startsWith("medical")||l.includes("siq"))return"Appointment on Base";return"On Hand"}
function mapSec(u){const t=(u||"").toUpperCase().split("-").pop();return {HQ:"HQ",EE:"HE",HE:"HE",CE:"CE",ORD:"ORD",UT:"UT"}[t]||"HQ"}
function fmtD(s){if(!s)return"";const m=s.match(/(\d{4})[\/-](\d{2})[\/-](\d{2})/);if(!m)return s;
  const M=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];return m[3]+" "+M[+m[2]-1]+" "+m[1].slice(2)}
function importCSV(text){
  const rows=parseCSV(text);const hi=rows.findIndex(r=>(r[0]||"").toLowerCase()==="rank");
  if(hi<0)throw new Error("No header row starting with 'Rank' was found.");
  const H=rows[hi].map(x=>x.toLowerCase());const col=n=>H.indexOf(n);
  const own=col("section")>=0&&col("status")>=0;
  const out=[];let n=0;
  for(const r of rows.slice(hi+1)){const rank=(r[col("rank")]||"").toUpperCase();const name=r[col("name")]||"";if(!rank||!name)continue;

    else{const det=r[col("duty status")]||"";out.push({id:"m"+(++n),rank,name,sec:mapSec(r[col("unit")]),status:mapStatus(det),detail:det,loc:r[col("location")]||"",start:fmtD(r[col("start date")]),end:fmtD(r[col("end date")]),edd:fmtD(r[col("edd")]||"")})}}
  if(!out.length)throw new Error("The file had a header but no Marines under it.");
  return {roster:out,own};
}
function exportCSV(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
