# Runs the automated tests on every change: the app in a test browser (every screen, check-in, PIN lock, PDF,
# import, alerts, integrations), every Supabase setup part on a real Postgres, and the Pro/billing signature checks.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf poppler-utils >/dev/null
      - run: npm ci
      - run: npm test
