# Codemagic cloud build: Accounted For (iOS) -> TestFlight / App Store Connect
# Needs one Codemagic setting: Team -> Integrations -> Developer Portal,
# an App Store Connect API key saved under the name "AccountedFor ASC".
workflows:
  ios-appstore:
    name: Accounted For - iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AccountedFor ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.antoniotyler.accountedfor
      vars:
        APP_STORE_APPLE_ID: 6826541947
      node: 22
      xcode: latest
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app and sync iOS
        script: npm run sync:ios
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Build IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - antoniotyler22@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
